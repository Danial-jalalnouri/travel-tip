<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Tips - Share Your Adventures</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <h1>Travel Tips</h1>
      <p class="subtitle">Discover and share the best travel experiences from around the world</p>
    </header>

    <div class="main-grid">
      <!-- Add Tip Form -->
      <section class="card add-tip-section">
        <div class="card-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <h2>Share a Tip</h2>
        </div>
        <form id="tipForm" class="tip-form">
          <div class="form-row">
            <div class="form-group">
              <label for="country">Country</label>
              <input type="text" id="country" name="country" required placeholder="e.g., Japan">
            </div>
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required placeholder="e.g., Tokyo">
            </div>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="form-group">
            <label for="description">Your Tip</label>
            <textarea id="description" name="description" required placeholder="Share your travel tip..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Tip
          </button>
        </form>
      </section>

      <!-- Search Section -->
      <section class="card search-section">
        <div class="card-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <h2>Search Tips</h2>
        </div>
        <div class="search-form">
          <div class="search-grid">
            <div class="search-input-group">
              <input type="text" id="searchCountry" placeholder="Country...">
            </div>
            <div class="search-input-group">
              <input type="text" id="searchCity" placeholder="City...">
            </div>
            <div class="search-input-group">
              <input type="date" id="searchAfterDate" title="Show tips after this date">
            </div>
            <div class="search-input-group full-width">
              <input type="text" id="searchDescription" placeholder="Search in tips...">
            </div>
          </div>
          <div class="search-actions">
            <button id="searchBtn" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              Search
            </button>
            <button id="clearSearchBtn" class="btn btn-outline">Clear</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Tips List -->
    <section class="card tips-section">
      <div class="card-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <h2>Recent Tips <span id="tipCount" class="tip-count"></span></h2>
      </div>
      <div id="tipsList" class="tips-list">
        <!-- Tips will be loaded here -->
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
