<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Tips - Share Your Adventures</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Travel Tips</h1>
      <p class="subtitle">Share your travel experiences with others</p>
    </header>

    <!-- Add Tip Form -->
    <section class="add-tip-section">
      <h2>Add a New Travel Tip</h2>
      <form id="tipForm" class="tip-form">
        <div class="form-row">
          <div class="form-group">
            <label for="country">Country *</label>
            <input type="text" id="country" name="country" required placeholder="e.g., Japan">
          </div>
          <div class="form-group">
            <label for="city">City *</label>
            <input type="text" id="city" name="city" required placeholder="e.g., Tokyo">
          </div>
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" name="date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Your Tip *</label>
          <textarea id="description" name="description" required placeholder="Share your travel tip..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Tip</button>
      </form>
    </section>

    <!-- Search Section -->
    <section class="search-section">
      <h2>Search Tips</h2>
      <div class="search-form">
        <div class="search-row">
          <input type="text" id="searchCountry" placeholder="Search by country...">
          <input type="text" id="searchCity" placeholder="Search by city...">
          <input type="date" id="searchAfterDate" title="Show tips after this date">
          <input type="text" id="searchDescription" placeholder="Search in tips...">
          <button id="searchBtn" class="btn btn-secondary">Search</button>
          <button id="clearSearchBtn" class="btn btn-outline">Clear</button>
        </div>
      </div>
    </section>

    <!-- Tips List -->
    <section class="tips-section">
      <h2>Travel Tips <span id="tipCount" class="tip-count"></span></h2>
      <div id="tipsList" class="tips-list">
        <!-- Tips will be loaded here -->
      </div>
    </section>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Edit Tip</h2>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label for="editCountry">Country</label>
            <input type="text" id="editCountry" required>
          </div>
          <div class="form-group">
            <label for="editCity">City</label>
            <input type="text" id="editCity" required>
          </div>
          <div class="form-group">
            <label for="editDate">Date</label>
            <input type="date" id="editDate" required>
          </div>
        </div>
        <div class="form-group">
          <label for="editDescription">Your Tip</label>
          <textarea id="editDescription" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
